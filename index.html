
<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1">

  <title>QA Attendance GPS Check In</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f5f7fa;
      padding: 22px;
      color: #1c2939;
    }

    main {
      max-width: 440px;
      margin: 40px auto;
      padding: 26px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 25px #0001;
    }

    button {
      width: 100%;
      padding: 17px;
      border: 0;
      border-radius: 12px;
      background: #06c755;
      color: white;
      font-weight: bold;
      font-size: 17px;
    }

    button:disabled {
      opacity: .5;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #f3f5f9;
      padding: 15px;
      border-radius: 10px;
    }

    small {
      color: #526174;
    }
  </style>
</head>

<body>
  <main>
    <h2>📍 QA Attendance — GPS CHECK IN</h2>

    <p>
      ระบบจะตรวจสอบว่า CHECK IN วันนี้แล้วหรือยัง
      ก่อนขออนุญาตอ่านตำแหน่ง GPS
    </p>

    <button id="go" disabled>
      กำลังเชื่อมต่อ LINE...
    </button>

    <p id="status" role="status">
      กำลังเตรียมระบบ
    </p>

    <pre id="detail">ยังไม่ได้อ่านตำแหน่ง</pre>

    <small>
      กรุณาเปิดผ่าน LINE
      ข้อมูล GPS ใช้สำหรับลงเวลาเข้างานเท่านั้น
    </small>
  </main>

  <script>
    const LIFF_ID = '2012205870-cIwGKg7e';

    const WORKER_URL =
      'https://qa-line-attendance.luangee-kh.workers.dev';

    const go = document.getElementById('go');
    const status = document.getElementById('status');
    const detail = document.getElementById('detail');

    let sending = false;


    // ===================================
    // CHECK STATUS
    // ===================================

    async function checkStatus() {
      const idToken = liff.getIDToken();

      if (!idToken) {
        throw new Error(
          'ไม่พบ LINE ID Token กรุณาเปิด LIFF ใหม่'
        );
      }

      const controller = new AbortController();

      const timer = setTimeout(
        () => controller.abort(),
        12000
      );

      try {
        const response = await fetch(
          WORKER_URL + '/api/checkin-status',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              idToken: idToken
            }),
            signal: controller.signal,
            cache: 'no-store'
          }
        );

        const data = await response.json();

        if (
          !response.ok ||
          !data.ok ||
          !data.status
        ) {
          throw new Error(
            data.error || 'ตรวจสอบสถานะไม่ได้'
          );
        }

        return data.status;

      } finally {
        clearTimeout(timer);
      }
    }


    // ===================================
    // INITIALIZE LIFF
    // ===================================

    async function init() {
      try {
        await liff.init({
          liffId: LIFF_ID
        });

        if (!liff.isInClient()) {
          status.textContent =
            'กรุณาเปิดลิงก์ LIFF ผ่าน LINE';

          go.textContent =
            'เปิดผ่าน LINE เพื่อ CHECK IN';

          return;
        }

        if (!liff.isLoggedIn()) {
          status.textContent =
            'กรุณาเข้าสู่ระบบ LINE';

          return;
        }

        status.textContent =
          'กำลังตรวจสอบ CHECK IN วันนี้...';

        const result = await checkStatus();

        if (result.registered === false) {
          status.textContent =
            '🔒 กรุณากด REGISTER ก่อนใช้งานค่ะ';

          go.textContent =
            'ยังไม่ได้ลงทะเบียน';

          return;
        }

        if (result.checkedIn) {
          status.textContent =
            'ℹ️ วันนี้คุณ CHECK IN แล้วค่ะ';

          detail.textContent =
            'ชื่อ: ' + (result.name || '-') +
            '\nวันที่: ' + (result.date || '-') +
            '\nเวลาเข้า: ' +
            (result.checkInTime || '-');

          go.textContent =
            'CHECK IN แล้ว — ไม่ต้องส่ง GPS ซ้ำ';

          return;
        }

        status.textContent =
          'ยังไม่ CHECK IN วันนี้ พร้อมอ่านตำแหน่ง';

        go.textContent =
          'อนุญาต GPS และยืนยัน CHECK IN';

        go.disabled = false;

      } catch (error) {
        status.textContent =
          '⚠️ ตรวจสอบสถานะไม่สำเร็จ: ' +
          error.message;

        go.textContent =
          'ตรวจสอบไม่ได้ — กรุณาเปิดใหม่';
      }
    }


    // ===================================
    // GPS CHECK IN
    // ===================================

    go.onclick = async () => {
      if (sending) return;

      sending = true;
      go.disabled = true;

      status.textContent =
        'กำลังตรวจสอบอีกครั้ง...';

      try {
        const result = await checkStatus();

        if (
          !result.registered ||
          result.checkedIn
        ) {
          status.textContent = result.checkedIn
            ? 'ℹ️ วันนี้คุณ CHECK IN แล้วค่ะ'
            : '🔒 กรุณา REGISTER ก่อน';

          detail.textContent = result.checkedIn
            ? 'เวลาเข้า: ' +
              (result.checkInTime || '-')
            : 'ยังไม่ได้ลงทะเบียน';

          go.textContent = 'ไม่ต้องส่ง GPS';

          return;
        }

      } catch (error) {
        status.textContent =
          '⚠️ ตรวจสอบสถานะไม่ได้: ' +
          error.message;

        go.textContent = 'ลองอีกครั้ง';
        go.disabled = false;
        sending = false;

        return;
      }

      status.textContent = 'กำลังขอ GPS...';

      if (!navigator.geolocation) {
        status.textContent =
          'อุปกรณ์ไม่รองรับ GPS';

        go.disabled = false;
        sending = false;

        return;
      }

      navigator.geolocation.getCurrentPosition(
        async position => {
          const {
            latitude,
            longitude,
            accuracy
          } = position.coords;

          detail.textContent =
            `Latitude: ${latitude}\n` +
            `Longitude: ${longitude}\n` +
            `Accuracy: ${Math.round(accuracy)} เมตร`;

          try {
            status.textContent =
              'กำลังส่งข้อมูลเข้า LINE...';

            const message =
              `GPSCHECKIN|${latitude}|` +
              `${longitude}|${accuracy}|${Date.now()}`;

            await liff.sendMessages([
              {
                type: 'text',
                text: message
              }
            ]);

            status.textContent =
              '✅ ส่งข้อมูลแล้ว กรุณากลับไปดูผล CHECK IN ในแชต LINE';

            go.textContent = 'ส่งสำเร็จ';

          } catch (error) {
            status.textContent =
              'ส่งข้อมูลไม่สำเร็จ: ' +
              error.message;

            go.disabled = false;
            sending = false;
          }
        },

        error => {
          status.textContent =
            'อ่าน GPS ไม่สำเร็จ: ' +
            error.message;

          go.disabled = false;
          sending = false;
        },

        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }
      );
    };

    init();
  </script>
</body>
</html>
